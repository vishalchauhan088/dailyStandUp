spring.application.name=dailyStandUp

# JWT Configuration
# IMPORTANT: In production, use environment variables for secrets!
# Example: app.jwt.secret=${JWT_SECRET:your-secret-here}
app.jwt.secret=your-256-bit-secret-key-here-change-in-production
app.jwt.expiration=360000000

# H2 file-based DB (persists data)
spring.datasource.url=jdbc:h2:file:./data/dailyStandUpDB;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.com.vishalchauhan0688.dailyStandUp=INFO
