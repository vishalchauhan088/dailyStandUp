spring.application.name=dailyStandUp

spring.main.allow-circular-references=true

app.jwt.secret=Hii there, This is my Fucking long long jwt secret. Please don't steal it.
app.jwt.expiration=360000000

# H2 file-based DB (persists data)
spring.datasource.url=jdbc:h2:file:./data/dailyStandUpDB;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.com.vishalchauhan0688.dailyStandUp=INFO
